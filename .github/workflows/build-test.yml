name: build-test
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or SHA of this fork to build
        required: true
      pytest_filter:
        description: Optional pytest -k expression (empty runs all tests)
        required: false
        default: ''
      test_files:
        description: Optional space-separated test files under rclpy/test (empty runs all)
        required: false
        default: ''
      colcon_test:
        description: Run colcon test (ctest) like the ROS build farm instead of the pytest loop
        required: false
        default: 'false'
      testing_repo:
        description: Install ROS packages from ros2-testing like the build farm
        required: false
        default: 'false'
      ctest_args:
        description: Extra ctest arguments for colcon test, e.g. -R test_executor --repeat until-fail:5
        required: false
        default: ''
jobs:
  build:
    runs-on: ubuntu-latest
    container: ros:rolling
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          path: ws/src/rclpy
      - name: deps
        shell: bash
        run: |
          if [ "${{ inputs.testing_repo }}" = "true" ]; then
            grep -rn "ros.org" /etc/apt/ || true
            for f in $(grep -rl "packages.ros.org/ros2/ubuntu" /etc/apt/ || true); do
              sed -i 's#packages.ros.org/ros2/ubuntu#packages.ros.org/ros2-testing/ubuntu#' "$f"
            done
            grep -rn "ros2-testing" /etc/apt/ || { echo "could not switch to ros2-testing"; exit 1; }
            apt-get update -qq && apt-get dist-upgrade -y -qq
          fi
          apt-get update -qq
          rosdep update -q
          cd ws && rosdep install --from-paths src -y -i -q --rosdistro rolling
          apt-get install -y -qq ros-rolling-ament-cmake-pytest python3-pytest-timeout || true
      - name: build
        shell: bash
        run: |
          source /opt/ros/rolling/setup.bash
          cd ws && colcon build --packages-select rclpy --event-handlers console_direct-
      - name: lint
        shell: bash
        run: |
          source /opt/ros/rolling/setup.bash
          cd ws/src/rclpy/rclpy
          ament_flake8 rclpy test || true
          ament_cpplint src || true
          ament_uncrustify src || true
          ament_copyright rclpy test src || true
          ament_lint_cmake CMakeLists.txt || true
          ament_pep257 rclpy || true
          ament_mypy --ament-strict . || true
      - name: colcon test
        if: ${{ inputs.colcon_test == 'true' }}
        shell: bash
        run: |
          source /opt/ros/rolling/setup.bash
          cd ws
          colcon test --packages-select rclpy --event-handlers console_direct- --ctest-args ${{ inputs.ctest_args }} || true
          colcon test-result --all --verbose
      - name: test
        if: ${{ inputs.colcon_test != 'true' }}
        shell: bash
        run: |
          source /opt/ros/rolling/setup.bash
          source ws/install/setup.bash
          export PYTHONPATH="$PWD/ws/build/rclpy:$PYTHONPATH"
          cd ws/src/rclpy/rclpy
          FILES=""
          for f in ${{ inputs.test_files }}; do FILES="$FILES test/$f"; done
          if [ -z "$FILES" ]; then FILES=$(ls test/test_*.py); fi
          K="${{ inputs.pytest_filter }}"
          FAILED=""
          for f in $FILES; do
            echo "=== $f"
            if [ -n "$K" ]; then ARGS="-k $K"; else ARGS=""; fi
            timeout 600 python3 -m pytest -q -W error $f $ARGS -p no:cacheprovider || FAILED="$FAILED $f"
          done
          echo "FAILED FILES:$FAILED"
          [ -z "$FAILED" ]
